# Checks every pull request and push to main. Make "Checks" a required status
# check in a ruleset on main so nothing merges without it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - run: npm run lint
      # Route types (LayoutProps etc.) are generated, not committed: make them first.
      - run: npm run typecheck
      # Fails if a test fails or coverage drops below the floor in vitest.config.mts.
      - run: npm run test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: node scripts/coverage-summary.mjs
      - name: Upload the coverage report
        if: ${{ !cancelled() && hashFiles('coverage/index.html') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
      # Also builds the server bundle and fails if it picked up .git, src or .env files.
      - run: npm run desktop:build
      - run: npm audit --audit-level=high

  # The tests again on macOS and Windows, so platform code (ps, /Applications,
  # Terminal, taskkill, .cmd shims) runs for real on every system the app ships
  # for. Checks covers Linux.
  tests:
    name: Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - run: npm test

  # Packages the app for each system (unpacked, no installer) and launches it:
  # the bundled server must start and the window load (scripts/smoke-desktop.mjs).
  desktop:
    name: Desktop app (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest }
          - { name: Linux, os: ubuntu-latest }
          - { name: Windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - run: npm run desktop:build
      # The real installers for this system (dmg and zip, AppImage, or the NSIS
      # installer), which also leaves the unpacked app that the smoke test runs.
      - run: npx electron-builder --config electron-builder.config.mjs --publish never
      - run: node scripts/smoke-desktop.mjs

      # Windows: install for this user, silently, and run the installed copy too.
      - name: Install and run the installed app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter '*-setup.exe' | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          node scripts/smoke-desktop.mjs "$env:LOCALAPPDATA\Programs\workbench\workbench.exe"

  # After a push to main, publishes main's coverage for the README badge: a
  # shields.io endpoint file, force-pushed as the only commit on the `badges`
  # branch. Only this job can write to the repo, and it runs no project code.
  coverage-badge:
    name: Coverage badge
    needs: checks
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
          path: coverage

      - name: Publish coverage.json to the badges branch
        run: |
          pct=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)
          color=$(jq -nr --argjson p "$pct" 'if $p >= 90 then "brightgreen" elif $p >= 80 then "green" elif $p >= 70 then "yellowgreen" elif $p >= 60 then "yellow" else "red" end')
          mkdir badges && cd badges
          jq -n --arg msg "${pct}%" --arg color "$color" '{schemaVersion: 1, label: "coverage", message: $msg, color: $color}' > coverage.json
          cat coverage.json
          git init -q -b badges
          git add coverage.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Coverage ${pct}% at ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
