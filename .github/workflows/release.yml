# Builds the macOS, Linux and Windows apps and publishes them as a GitHub
# release when a version tag is pushed:
#   after the release PR merges: git tag v<version> && git push origin v<version>
#
# 1. "macOS and Linux" (macOS runner) and "Windows" (Windows runner) build the
#    apps and their update feeds, without publishing anything.
# 2. "Publish" creates a draft release with every file and the release notes
#    from src/lib/releaseNotes.ts, adds SHA256SUMS and (in a public repo) a
#    signed build-provenance attestation per file, then publishes it. A
#    failure leaves an unpublished draft at most, and the order works with
#    immutable releases (Settings → General → Releases). Anyone can check a
#    download:
#      gh attestation verify workbench-<version>-arm64.dmg --repo <owner>/<repo>
#
# Approval: only "macOS and Linux" uses the "release" environment, which holds
# the Apple signing secrets and has the required reviewer. Publish needs it, so
# nothing is released without that one approval.
#
# Optional secrets on the "release" environment (without them the macOS app is
# ad-hoc signed and its updates link to their download):
#   CSC_LINK, CSC_KEY_PASSWORD        Developer ID Application certificate (.p12, base64) and its password
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   notarization
# Optional repository secret: RELEASES_TOKEN, a token that can create releases
# in the releases repo when that isn't this repo (installed apps can't read a
# private repo). Optional variables: RELEASES_OWNER, RELEASES_REPO (default:
# this repo). Windows builds are unsigned for now (SmartScreen warns on first
# install); a certificate would go in an environment on the Windows job.
#
# Actions are pinned to full commit SHAs (tag in the comment) so a moved tag
# can't change what runs with the signing secrets. Dependabot keeps them current.
name: Release desktop app

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  RELEASES_OWNER: ${{ vars.RELEASES_OWNER || github.repository_owner }}
  RELEASES_REPO: ${{ vars.RELEASES_REPO || github.event.repository.name }}

jobs:
  mac-linux:
    name: macOS and Linux
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # electron-builder downloads its own Electron; skip the dev binary.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi

      # The full audit: electron-updater ships in the app but is a devDependency.
      - name: Refuse to ship known high or critical vulnerabilities
        run: npm audit --audit-level=high

      - name: Build
        run: npm run desktop:build && npx electron-builder --config electron-builder.config.mjs --mac --linux --publish never
        env:
          WORKBENCH_RELEASES_OWNER: ${{ env.RELEASES_OWNER }}
          WORKBENCH_RELEASES_REPO: ${{ env.RELEASES_REPO }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-mac-linux
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.blockmap
            release/latest-*.yml

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi

      - name: Build
        run: npm run desktop:build && npx electron-builder --config electron-builder.config.mjs --win --publish never
        env:
          WORKBENCH_RELEASES_OWNER: ${{ env.RELEASES_OWNER }}
          WORKBENCH_RELEASES_REPO: ${{ env.RELEASES_REPO }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-windows
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

  publish:
    name: Publish
    needs: [mac-linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload files
      id-token: write # sign the provenance attestation
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: release

      - name: Checksums
        working-directory: release
        run: |
          sha256sum *.dmg *.zip *.AppImage *.exe > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
          cat release-notes.md

      # Re-runs reuse the draft from an earlier attempt.
      - name: Create the draft and upload every file
        run: |
          repo="$RELEASES_OWNER/$RELEASES_REPO"
          if ! gh release view "$GITHUB_REF_NAME" --repo "$repo" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "${GITHUB_REF_NAME#v}" --notes-file release-notes.md --repo "$repo"
          fi
          gh release upload "$GITHUB_REF_NAME" release/* --clobber --repo "$repo"

      # Signed (Sigstore) record that this workflow built these files from this commit.
      # Attestations need a public repo on GitHub's Free, Pro and Team plans.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.exe

      # Last, so nothing above can change a published release. With immutable
      # releases on, this locks the release's files and tag.
      - name: Publish the release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$RELEASES_OWNER/$RELEASES_REPO"
